name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-18]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libboost-json-dev libboost-serialization-dev libeigen3-dev g++-14 clang-18

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DMULTIDIAGONAL_BENCHMARK_NATIVE=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke run
        if: matrix.build_type == 'Release'
        run: |
          ./build/benchmarks/cppqed-multidiagonal-benchmarks --smoke > /dev/null
          ./build/benchmarks/cppqed-multidiagonal-kernels --smoke > /dev/null
          ./build/benchmarks/cppqed-multidiagonal-kernels-cxlr --smoke > /dev/null

      # the driver of a measuring session and the reduction of its results (#37); the timings mean nothing here
      - name: Benchmark driver smoke run
        if: matrix.build_type == 'Release'
        run: |
          benchmarks/run.sh --no-pin --smoke --rounds 2 "$RUNNER_TEMP/session" ci=build
          benchmarks/reduce.py report "$RUNNER_TEMP/session" > /dev/null
          benchmarks/reduce.py ratios ci="$RUNNER_TEMP/session":4k > /dev/null

      # plot.py on the driver's smoke session (a test of the script) and on the two sessions of 2026-11-23
      # in the repository (figures worth looking at); the figures are kept with the run
      - name: Figures
        if: matrix.build_type == 'Release' && matrix.compiler == 'g++-14'
        run: |
          sudo apt-get install -y python3-matplotlib
          benchmarks/plot.py "$RUNNER_TEMP/session":4k "$RUNNER_TEMP/figures/smoke"
          benchmarks/plot.py benchmarks/results/2026-11-23-bench:4k "$RUNNER_TEMP/figures/2026-11-23-bench"
          benchmarks/plot.py benchmarks/results/2026-11-23-zen2-vm "$RUNNER_TEMP/figures/2026-11-23-zen2-vm"

      - name: Keep the figures
        if: matrix.build_type == 'Release' && matrix.compiler == 'g++-14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figures
          path: ${{ runner.temp }}/figures

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SANITIZE: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libboost-json-dev libboost-serialization-dev libeigen3-dev clang-18

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="$SANITIZE"
          -DCMAKE_EXE_LINKER_FLAGS="$SANITIZE"
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DMULTIDIAGONAL_BENCHMARK_NATIVE=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke run
        run: |
          ./build/benchmarks/cppqed-multidiagonal-benchmarks --smoke > /dev/null
          ./build/benchmarks/cppqed-multidiagonal-kernels --smoke > /dev/null
          ./build/benchmarks/cppqed-multidiagonal-kernels-cxlr --smoke > /dev/null

  # tests/consumer is a separate downstream project: the library must work installed
  # (find_package) and as a pinned FetchContent subproject, under the documented target name.
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # FetchContent clones this checkout at github.sha

      # Without the compiled Boost.Serialization: consumers need only its headers, which come with libboost-dev (#16)
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libboost-json-dev libeigen3-dev g++-14

      - name: Install the library
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DBUILD_TESTING=OFF
          cmake --install build --prefix "$RUNNER_TEMP/prefix"

      - name: Consume via find_package
        run: |
          cmake -S tests/consumer -B consumer-fp -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build consumer-fp
          ./consumer-fp/consumer

      - name: Consume via FetchContent at the pinned commit
        run: |
          cmake -S tests/consumer -B consumer-fc -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DMULTIDIAGONAL_CONSUME=FetchContent \
          -DMULTIDIAGONAL_GIT_REPOSITORY="$GITHUB_WORKSPACE" -DMULTIDIAGONAL_GIT_TAG=${{ github.sha }}
          cmake --build consumer-fc
          ./consumer-fc/consumer
